<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:390px;height:844px;overflow:hidden;font-family:'Atkinson Hyperlegible';background:#F6F1E7;color:#15120E}
.wall{background:#E6A71C;padding:22px 20px 26px;position:relative}
.top{display:flex;justify-content:space-between;font:700 13px 'Atkinson Hyperlegible';letter-spacing:.04em;text-transform:uppercase}
h1{font:400 44px/0.95 'Bungee';margin:26px 0 0;color:#1F2F6B;text-shadow:3px 3px 0 #F6F1E7,6px 6px 0 #15120E}
.sub{font-size:17px;margin:14px 0 0;max-width:300px}
.band{background:#1F2F6B;color:#F6F1E7;padding:20px}
.raised{font:400 40px 'Bungee';color:#E6A71C}
.of{font-size:15px;opacity:.9}
.bar{height:18px;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(246,241,231,.35) 8px 10px);border:2px solid #F6F1E7;margin:12px 0 6px;position:relative}
.bar i{position:absolute;inset:0 38% 0 0;background:#E6A71C}
.gap{font:400 15px 'Bungee';color:#F6F1E7}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 20px 10px}
.amts b{font:400 16px 'Bungee';border:2px solid #15120E;padding:12px 0;text-align:center;background:#F6F1E7}
.amts b.on{background:#B23A1E;color:#F6F1E7;border-color:#B23A1E}
.cta{margin:8px 20px;background:#15120E;color:#E6A71C;font:400 22px 'Bungee';text-align:center;padding:16px}
.sup{padding:12px 20px;font-size:15px}.sup p{margin:6px 0}.sup p:first-child{font-weight:700}.sup p:nth-child(n+3){opacity:.55}
</style></head><body>
<div class="wall"><div class="top"><span>SF Vibe Lab · Mérida</span><span>Donar</span></div>
<h1>MÉRIDA VA A MEXICO DREAMIN'</h1>
<p class="sub">20 estudiantes de la UADY rumbo a la CDMX el 20 de noviembre. Ayúdanos a llegar.</p></div>
<div class="band"><div class="raised">$31,250</div><div class="of">de $50,000 MXN · cierra el 15 de nov</div>
<div class="bar"><i></i></div><div class="gap">FALTAN $18,750</div></div>
<div class="amts"><b>100</b><b class="on">250</b><b>500</b><b>1,000</b></div>
<div class="cta">DONAR $250</div>
<div class="sup"><p>Ana López · $500</p><p>Empresa Ejemplo · $2,000</p><p>Luis P. · $250</p></div>
</body></html>
