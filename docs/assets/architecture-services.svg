<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 710" width="1070" height="710" role="img" aria-label="Services diagram. The React app reads campaigns from a Salesforce public API and requests a payment session. Salesforce creates a Stripe PaymentIntent and returns a client secret. The card field sends card details straight to Stripe. Stripe sends a webhook to Salesforce, which records the donation, and Stripe emails the receipt. Salesforce emails an invoice only when requested.">
<style>
.box{fill:#fff;stroke:#8b979d;stroke-width:1.2}.org{fill:none;stroke:#0a62b8;stroke-width:1.8}.stripe{fill:none;stroke:#5a4fe0;stroke-width:1.8}
.std{fill:#fff;stroke:#0a62b8;stroke-width:1.5}.cus{fill:#fff;stroke:#b4580a;stroke-width:1.5}
.ln{fill:none;stroke:#1b2428;stroke-width:1.5;marker-end:url(#a1)}.ln2{fill:none;stroke:#1b2428;stroke-width:1.5;marker-end:url(#a2)}
.dash{stroke-dasharray:5 4}.mk{fill:#1b2428}
.t{font:600 13px sans-serif;fill:#1b2428}.s{font:400 11.5px sans-serif;fill:#5a666c}.l{font:400 11.5px sans-serif;fill:#1b2428}
.o{font:600 12px sans-serif;fill:#0a62b8}.p{font:600 12px sans-serif;fill:#5a4fe0}.f{font:400 11.5px monospace;fill:#1b2428}
.fc{font:400 11.5px monospace;fill:#b4580a}.tag{font:400 10.5px sans-serif;fill:#5a666c;letter-spacing:.04em}.tagc{font:600 10.5px sans-serif;fill:#b4580a;letter-spacing:.04em}
</style>
<rect width="100%" height="100%" fill="#fff"/>
        <defs>
          <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
        </defs>

        <!-- donor browser -->
        <rect class="box" x="20" y="60" width="240" height="220" rx="6"/>
        <text class="t" x="36" y="84">Donor's browser</text>
        <rect class="box" x="40" y="100" width="200" height="70" rx="4"/>
        <text class="t" x="140" y="128" text-anchor="middle">React web app</text>
        <text class="s" x="140" y="148" text-anchor="middle">Docker on team server, HTTPS</text>
        <rect class="box" x="40" y="200" width="200" height="60" rx="4"/>
        <text class="t" x="140" y="226" text-anchor="middle">Stripe.js card field</text>
        <text class="s" x="140" y="244" text-anchor="middle">card number stays with Stripe</text>

        <!-- 1, 2, 4: browser <-> salesforce -->
        <path class="ln" d="M240 112 H780"/>
        <text class="l" x="510" y="106" text-anchor="middle">1  read campaigns, supporters (CORS allows our origin)</text>
        <path class="ln" d="M240 135 H780"/>
        <text class="l" x="510" y="129" text-anchor="middle">2  start payment (amount in MXN, campaign, donor details)</text>
        <path class="ln" d="M780 158 H240"/>
        <text class="l" x="510" y="152" text-anchor="middle">4  client secret</text>

        <!-- salesforce -->
        <rect class="org" x="760" y="40" width="290" height="620" rx="8"/>
        <text class="o" x="780" y="62">Salesforce Developer Edition org</text>
        <rect class="box" x="780" y="80" width="250" height="80" rx="4"/>
        <text class="t" x="790" y="100">Public API (Apex REST)</text>
        <text class="s" x="790" y="118">guest user, Apex access only</text>
        <text class="s" x="790" y="134">campaigns, supporters, payment session</text>
        <text class="s" x="790" y="150">no object permissions for guests</text>
        <path class="ln" d="M905 160 V200"/>
        <text class="s" x="915" y="184">calls</text>
        <rect class="box" x="780" y="200" width="250" height="60" rx="4"/>
        <text class="t" x="790" y="220">Payment session service</text>
        <text class="s" x="790" y="238">Named Credential holds the Stripe key</text>
        <text class="s" x="790" y="252">builds the PaymentIntent</text>

        <rect class="box" x="780" y="325" width="250" height="70" rx="4"/>
        <text class="t" x="790" y="345">Webhook endpoint (Apex REST)</text>
        <text class="s" x="790" y="363">checks signature, skips duplicates</text>
        <text class="s" x="790" y="379">then records the donation</text>
        <path class="ln" d="M905 395 V425"/>
        <text class="s" x="915" y="414">writes</text>
        <rect class="box" x="780" y="425" width="250" height="100" rx="4"/>
        <text class="t" x="790" y="445">Records</text>
        <text class="s" x="790" y="463">Campaign, Contact, Account</text>
        <text class="s" x="790" y="479">Opportunity (the donation)</text>
        <text class="s" x="790" y="495">Invoice_Request__c</text>
        <text class="s" x="790" y="511">Stripe_Event__c</text>
        <rect class="box" x="780" y="545" width="250" height="50" rx="4"/>
        <text class="t" x="790" y="565">Lightning app for staff</text>
        <text class="s" x="790" y="583">manual donations, moderation, log</text>
        <rect class="box" x="780" y="610" width="250" height="40" rx="4"/>
        <text class="t" x="790" y="634">Receipt email, invoice if requested</text>

        <!-- stripe -->
        <rect class="stripe" x="280" y="160" width="320" height="315" rx="8"/>
        <text class="p" x="300" y="182">Stripe (test mode)</text>
        <rect class="box" x="300" y="195" width="280" height="50" rx="4"/>
        <text class="t" x="310" y="215">PaymentIntents API</text>
        <text class="s" x="310" y="233">keeps the donor details as metadata</text>
        <rect class="box" x="300" y="265" width="280" height="50" rx="4"/>
        <text class="t" x="310" y="285">Card endpoint (Stripe.js)</text>
        <text class="s" x="310" y="303">confirms the payment with the card</text>
        <rect class="box" x="300" y="335" width="280" height="50" rx="4"/>
        <text class="t" x="310" y="355">Webhook sender</text>
        <text class="s" x="310" y="373">payment_intent.succeeded, .payment_failed</text>
        <rect class="box" x="300" y="405" width="280" height="50" rx="4"/>
        <text class="t" x="310" y="425">No receipt email in test mode</text>
        <text class="s" x="310" y="443">Salesforce sends it instead</text>

        <!-- 3, 5, 6 -->
        <path class="ln" d="M780 220 H580"/>
        <text class="l" x="680" y="214" text-anchor="middle">3  create PaymentIntent</text>
        <path class="ln" d="M240 235 H270 V290 H300"/>
        <text class="l" x="140" y="312" text-anchor="middle">5  card details go straight to Stripe</text>
        <path class="ln" d="M580 360 H780"/>
        <text class="l" x="680" y="354" text-anchor="middle">6  webhook event</text>

        <!-- 7, 8: emails -->
        <rect class="box" x="20" y="520" width="240" height="70" rx="6"/>
        <text class="t" x="36" y="545">Donor's inbox</text>
        <text class="s" x="36" y="565">receipt, optional invoice</text>
        <path class="ln dash" d="M905 650 V690 H140 V592"/>
        <text class="l" x="520" y="683" text-anchor="middle">7  receipt email, 8  invoice email only if requested</text>
      </svg>