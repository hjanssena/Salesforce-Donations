# Runs the web app on the server. Tailscale Funnel publishes it to the internet
# and terminates TLS, so the container only listens on localhost over HTTP.
# Values come from .env next to this file (not committed). The deploy workflow
# loads the image built in GitHub Actions, so the server never builds;
# `docker compose build` still works locally.
services:
  web:
    build: .
    image: mexico-dreamin-web:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    environment:
      SF_SITE_URL: ${SF_SITE_URL:?set SF_SITE_URL in .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?set STRIPE_PUBLISHABLE_KEY in .env}
