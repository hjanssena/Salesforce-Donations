# Every location includes the headers, because Nginx drops inherited
# add_header lines in any block that sets its own.
root /usr/share/nginx/html;

# Hashed build assets never change, so cache them for a long time.
location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The page and the runtime config must always be fresh.
location = /config.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}

# Single-page app: unknown paths go to index.html.
location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
