name: Web deploy

# Builds the web app's Docker image here and ships it to the team server over
# SSH. Runs only when something under web/ changes on main (or by hand).
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a half-done one.
concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  IMAGE: mexico-dreamin-web
  # Public URL through Tailscale Funnel. Override with the SITE_URL repository variable.
  SITE_URL: ${{ vars.SITE_URL || 'https://dietpi.tail6cb6c6.ts.net:8443/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Never ship a build that fails the same checks as the PR workflow.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        env:
          # Set the DEPLOY_PLATFORM repository variable to linux/arm64 for an ARM server.
          PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
        run: |
          docker buildx build . \
            --platform "$PLATFORM" \
            --tag "$IMAGE:${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --output "type=docker,dest=$RUNNER_TEMP/image.tar"

      # One flat folder: the image plus the files the server needs to run it.
      - name: Bundle the deploy files
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          gzip -1 -c "$RUNNER_TEMP/image.tar" > "$RUNNER_TEMP/bundle/image.tar.gz"
          cp docker-compose.yml "$RUNNER_TEMP/bundle/"
          ls -lhR "$RUNNER_TEMP/bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: ${{ runner.temp }}/bundle
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Holds the SSH secrets; add required reviewers here if deploys should wait for approval.
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    env:
      # The server's Tailscale address (100.x.y.z or its MagicDNS name). SSH is
      # never exposed to the internet; the runner joins the tailnet for this job.
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/mexico-dreamin-web' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-image
          path: bundle

      # Joins the tailnet as an ephemeral node tagged tag:ci; it is removed
      # automatically when the job ends. ACLs decide what tag:ci may reach.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the job refuses to talk to a server it does not recognise.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the image and compose file
        run: |
          ssh server "mkdir -p $DEPLOY_PATH"
          scp -q bundle/docker-compose.yml "server:$DEPLOY_PATH/docker-compose.yml"
          gunzip -c bundle/image.tar.gz | ssh server "docker load"

      # Piped to sh so it runs the same whatever the deploy user's login shell is.
      - name: Restart the site
        run: |
          ssh server sh -s <<EOF
          set -e
          cd $DEPLOY_PATH
          test -f .env || { echo ".env is missing in $DEPLOY_PATH (see web/README.md)"; exit 1; }
          WEB_TAG=latest docker compose up -d --no-build --remove-orphans
          docker image prune -f >/dev/null
          docker compose ps
          EOF

      # Resolve through public DNS: inside the tailnet MagicDNS would send the
      # request to the server's Tailscale IP, which tag:ci may not reach.
      - name: Check the site answers
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS -o /dev/null --max-time 10 --doh-url https://1.1.1.1/dns-query "$SITE_URL"; then
              echo "Live: $SITE_URL"; exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE_URL did not answer. Is Funnel on? (see web/README.md)"; exit 1

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
