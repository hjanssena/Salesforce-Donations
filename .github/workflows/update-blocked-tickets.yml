name: Update blocked tickets

# When a ticket is closed, every ticket it blocks moves from Blocked to Todo,
# unless another open ticket still blocks it. When a ticket is reopened, the
# tickets it blocks that are still in Todo move back to Blocked.
# Needs the PROJECT_TOKEN secret: see docs/workflow/project-board.md.

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to treat as just closed (manual run)"
        required: true
      dry_run:
        description: "Only print what would change"
        default: "true"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Move the tickets this one blocks
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "6"
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ACTION: ${{ github.event.action || 'closed' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          name="${REPO#*/}"

          # Project id, Status field id and option ids
          meta=$(gh api graphql -f query='
            query($o:String!,$n:Int!){user(login:$o){projectV2(number:$n){
              id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
            -f o="$OWNER" -F n="$PROJECT_NUMBER")
          project_id=$(jq -r '.data.user.projectV2.id' <<<"$meta")
          field_id=$(jq -r '.data.user.projectV2.field.id' <<<"$meta")
          opt() { jq -r --arg n "$1" '.data.user.projectV2.field.options[]|select(.name==$n)|.id' <<<"$meta"; }
          blocked_id=$(opt Blocked); todo_id=$(opt Todo)

          for d in $(gh api "repos/$REPO/issues/$ISSUE/dependencies/blocking" --jq '.[].number'); do
            state=$(gh api "repos/$REPO/issues/$d" --jq .state)
            [ "$state" = "open" ] || continue

            item=$(gh api graphql -f query='
              query($o:String!,$r:String!,$d:Int!){repository(owner:$o,name:$r){issue(number:$d){
                projectItems(first:20){nodes{id project{id}
                  fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}' \
              -f o="$OWNER" -f r="$name" -F d="$d" \
              --jq ".data.repository.issue.projectItems.nodes[]|select(.project.id==\"$project_id\")")
            [ -n "$item" ] || continue
            item_id=$(jq -r .id <<<"$item"); current=$(jq -r '.fieldValueByName.name // ""' <<<"$item")

            if [ "$ACTION" = "closed" ]; then
              # Other blockers that are still open (the ticket that just closed does not count)
              open=$(gh api "repos/$REPO/issues/$d/dependencies/blocked_by" \
                --jq "[.[]|select(.state==\"open\" and .number!=$ISSUE)]|length")
              [ "$open" = "0" ] && [ "$current" = "Blocked" ] || continue
              target="$todo_id"; label="Todo"
            else
              [ "$current" = "Todo" ] || continue
              target="$blocked_id"; label="Blocked"
            fi

            echo "#$d: $current -> $label"
            if [ "$DRY_RUN" != "true" ]; then
              gh api graphql -f query='
                mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{
                  projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
                -f p="$project_id" -f i="$item_id" -f f="$field_id" -f o="$target" >/dev/null
            fi
          done
